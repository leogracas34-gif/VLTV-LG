name: Build webOS IPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar as ferramentas da LG (ares-cli)
        run: npm install -g @webos-tools/cli

      - name: Colocar a chave do TMDB no app (Secret TMDB_API_KEY)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          ARQUIVO=$(find . -name appinfo.json -not -path '*/node_modules/*' | head -n 1)
          PASTA=$(dirname "$ARQUIVO")
          CONFIG="$PASTA/js/config.js"
          CHAVE=$(printf '%s' "$TMDB_API_KEY" | tr -d '[:space:]"'"'"'')
          if [ -z "$CHAVE" ]; then
            echo "::warning::Secret TMDB_API_KEY vazio ou não encontrado. O app vai funcionar, mas sem logos."
          else
            sed -i "s|__TMDB_API_KEY__|$CHAVE|" "$CONFIG"
            if grep -q "__TMDB_API_KEY__" "$CONFIG"; then
              echo "ERRO: não consegui trocar a chave no config.js"
              exit 1
            fi
            echo "Chave do TMDB aplicada (${#CHAVE} caracteres)."
          fi

      - name: Colocar a chave do app no config.js (Secret VPS_APP_KEY)
        env:
          VPS_APP_KEY: ${{ secrets.VPS_APP_KEY }}
        run: |
          ARQUIVO=$(find . -name appinfo.json -not -path '*/node_modules/*' | head -n 1)
          PASTA=$(dirname "$ARQUIVO")
          CONFIG="$PASTA/js/config.js" node - <<'JS'
          const fs = require('fs');
          const arquivo = process.env.CONFIG;
          const chave = String(process.env.VPS_APP_KEY || '').trim();
          let texto = fs.readFileSync(arquivo, 'utf8');
          if (!chave) {
            console.log('::warning::Secret VPS_APP_KEY vazio ou não encontrado. O app funciona, mas não envia os créditos aprendidos.');
          } else {
            const seguro = chave.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            texto = texto.split('__VPS_APP_KEY__').join(seguro);
            if (texto.indexOf('__VPS_APP_KEY__') >= 0) { console.log('ERRO: não consegui trocar a chave no config.js'); process.exit(1); }
            fs.writeFileSync(arquivo, texto);
            console.log('Chave do app aplicada (' + chave.length + ' caracteres).');
          }
          JS

      - name: Gerar o .ipk
        run: |
          ARQUIVO=$(find . -name appinfo.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$ARQUIVO" ]; then
            echo "ERRO: appinfo.json não encontrado. A pasta webos precisa estar no repositório."
            exit 1
          fi
          PASTA=$(dirname "$ARQUIVO")
          echo "App encontrado em: $PASTA"
          mkdir -p saida
          ares-package "$PASTA" --outdir saida
          ls -la saida

      - name: Guardar o .ipk
        uses: actions/upload-artifact@v4
        with:
          name: vltv-webos-ipk
          path: saida/*.ipk
