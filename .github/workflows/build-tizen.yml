name: Build Tizen WGT (Samsung)

on:
  workflow_dispatch:
  push:
    paths:
      - 'webos/**'
      - 'tizen/**'
      - '.github/workflows/build-tizen.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Montar a pasta do app Samsung a partir do app da LG
        run: python3 tizen/montar.py

      - name: Colocar as chaves no config.js (Secrets TMDB_API_KEY e VPS_APP_KEY)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VPS_APP_KEY: ${{ secrets.VPS_APP_KEY }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const arq = 'tizen-build/js/config.js';
          let t = fs.readFileSync(arq, 'utf8');
          const tmdb = String(process.env.TMDB_API_KEY || '').replace(/[\s"']/g, '');
          const vps = String(process.env.VPS_APP_KEY || '').trim().replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          if (tmdb) { t = t.split('__TMDB_API_KEY__').join(tmdb); } else { console.log('::warning::TMDB_API_KEY vazio: o app funciona, só sem logos.'); }
          if (vps) { t = t.split('__VPS_APP_KEY__').join(vps); } else { console.log('::warning::VPS_APP_KEY vazio: o app funciona, mas não envia créditos aprendidos.'); }
          fs.writeFileSync(arq, t);
          JS

      - name: Instalar as ferramentas da Samsung (Tizen Studio CLI)
        run: |
          for v in 6.1 6.0 5.6 5.5; do
            U="https://download.tizen.org/sdk/Installer/tizen-studio_${v}/web-cli_Tizen_Studio_${v}_ubuntu-64.bin"
            if curl -fsSL -o /tmp/tizen-cli.bin "$U"; then echo "Baixou a versão $v"; break; fi
          done
          [ -s /tmp/tizen-cli.bin ] || { echo "ERRO: não consegui baixar o Tizen Studio CLI"; exit 1; }
          chmod +x /tmp/tizen-cli.bin
          /tmp/tizen-cli.bin --accept-license "$HOME/tizen-studio" > /tmp/tizen-install.log 2>&1 || { tail -30 /tmp/tizen-install.log; exit 1; }
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"

      - name: Certificado de autor (dos Secrets)
        env:
          P12_B64: ${{ secrets.TIZEN_AUTHOR_P12_B64 }}
          SENHA: ${{ secrets.TIZEN_AUTHOR_PASS }}
        run: |
          export PATH="$HOME/tizen-studio/tools/ide/bin:$PATH"
          if [ -z "$P12_B64" ] || [ -z "$SENHA" ]; then
            echo "ERRO: crie os Secrets TIZEN_AUTHOR_P12_B64 e TIZEN_AUTHOR_PASS"
            exit 1
          fi
          printf '%s' "$P12_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/autor.p12"
          SENHA="$(printf '%s' "$SENHA" | tr -d '\r\n')"
          export SENHA
          echo "Tamanho do .p12: $(stat -c%s "$RUNNER_TEMP/autor.p12") bytes"
          if keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/autor.p12" -storepass "$SENHA" > /dev/null 2>&1; then
            echo "TESTE DA SENHA DO AUTOR: OK"
          else
            echo "TESTE DA SENHA DO AUTOR: FALHOU (a senha do Secret não abre o .p12)"
            exit 1
          fi
          tizen security-profiles add -n vltv -a "$RUNNER_TEMP/autor.p12" -p "$SENHA"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          arq = os.path.expanduser('~/tizen-studio-data/profile/profiles.xml')
          tree = ET.parse(arq)
          itens = []
          for p in tree.getroot().iter('profile'):
              if p.get('name') != 'vltv':
                  continue
              for it in p.iter('profileitem'):
                  d = it.get('distributor')
                  if d == '0':
                      it.set('password', os.environ['SENHA'])
                  elif d == '1':
                      it.set('password', 'tizenpkcs12passfordsigner')
                  else:
                      it.set('password', '')
                  itens.append((d, 'com senha' if it.get('password') else 'sem senha'))
          tree.write(arq, encoding='UTF-8', xml_declaration=True)
          print('profiles.xml ajustado:', itens)
          PY
          tizen security-profiles list

      - name: Gerar o pacote .wgt
        run: |
          export PATH="$HOME/tizen-studio/tools/ide/bin:$PATH"
          mkdir -p saida
          tizen package -t wgt -s vltv -o saida -- tizen-build || {
            echo "=== FALHOU: FINAL DO LOG DO TIZEN ==="
            grep -E 'Caused by|ERROR' "$HOME/tizen-studio-data/cli/logs/cli.log" | tail -5
            exit 1
          }
          ls -la saida

      - name: Guardar o .wgt
        uses: actions/upload-artifact@v4
        with:
          name: vltv-tizen-wgt
          path: saida/*.wgt
