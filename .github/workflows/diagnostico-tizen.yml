name: Diagnostico certificado Tizen

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-22.04
    steps:
      - name: Instalar as ferramentas da Samsung (Tizen Studio CLI)
        run: |
          for v in 6.1 6.0 5.6 5.5; do
            U="https://download.tizen.org/sdk/Installer/tizen-studio_${v}/web-cli_Tizen_Studio_${v}_ubuntu-64.bin"
            if curl -fsSL -o /tmp/tizen-cli.bin "$U"; then echo "Baixou a versão $v"; break; fi
          done
          [ -s /tmp/tizen-cli.bin ] || { echo "ERRO: não consegui baixar o Tizen Studio CLI"; exit 1; }
          chmod +x /tmp/tizen-cli.bin
          /tmp/tizen-cli.bin --accept-license "$HOME/tizen-studio" > /tmp/tizen-install.log 2>&1 || { tail -30 /tmp/tizen-install.log; exit 1; }

      - name: Preparar
        env:
          P12_B64: ${{ secrets.TIZEN_AUTHOR_P12_B64 }}
          SENHA: ${{ secrets.TIZEN_AUTHOR_PASS }}
        run: |
          : > /tmp/resumo.txt
          cat > /tmp/h.sh <<'SH'
          set +e
          r() { echo "$*" | tee -a /tmp/resumo.txt; }
          export PATH="$HOME/tizen-studio/tools/ide/bin:$PATH"
          if [ -n "$SENHA" ]; then SENHA="$(printf '%s' "$SENHA" | tr -d '\r\n')"; export SENHA; fi
          SH
          . /tmp/h.sh
          printf '%s' "$P12_B64" | tr -d ' \r\n' | base64 -d > /tmp/autor.p12
          mkdir -p /tmp/app
          cat > /tmp/app/config.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <widget xmlns="http://www.w3.org/ns/widgets" xmlns:tizen="http://tizen.org/ns/widgets" id="http://example.com/Teste" version="1.0.0" viewmodes="maximized">
            <tizen:application id="TESTE00001.Teste" package="TESTE00001" required_version="4.0"/>
            <content src="index.html"/>
            <name>Teste</name>
          </widget>
          XML
          echo '<html><body>teste</body></html>' > /tmp/app/index.html
          r "Tamanho do .p12: $(stat -c%s /tmp/autor.p12) bytes"
          r "Senha: ${#SENHA} caracteres, $(printf '%s' "$SENHA" | tr -d 'A-Za-z0-9' | wc -c) simbolo(s)"
          r "Java do Tizen: $("$HOME/tizen-studio/jdk/bin/java" -version 2>&1 | head -1)"
          r "Launcher do tizen (como repassa os argumentos):"
          grep -anE 'java|\$@|\$\*|eval' "$HOME/tizen-studio/tools/ide/bin/tizen" | head -8 | cut -c1-140 | tee -a /tmp/resumo.txt

      - name: Teste 1 - ler a chave com Java
        continue-on-error: true
        env:
          SENHA: ${{ secrets.TIZEN_AUTHOR_PASS }}
        run: |
          . /tmp/h.sh
          mkdir -p /tmp/cls
          cat > /tmp/Teste.java <<'JAVA'
          import java.io.*;
          import java.security.*;
          import java.util.*;
          public class Teste {
            public static void main(String[] a) throws Exception {
              char[] pw = System.getenv("SENHA").toCharArray();
              KeyStore ks = KeyStore.getInstance("PKCS12");
              try (InputStream in = new FileInputStream(a[0])) { ks.load(in, pw); }
              System.out.println("abrir o arquivo: OK");
              for (Enumeration<String> e = ks.aliases(); e.hasMoreElements();) {
                String al = e.nextElement();
                try {
                  Key k = ks.getKey(al, pw);
                  System.out.println("ler a chave privada: " + (k == null ? "sem chave neste item" : "OK"));
                } catch (Exception ex) {
                  System.out.println("ler a chave privada: FALHOU - " + ex);
                }
              }
            }
          }
          JAVA
          if ! javac --release 8 -d /tmp/cls /tmp/Teste.java 2>/tmp/javac.log; then r "T1: nao compilou - $(head -1 /tmp/javac.log)"; exit 0; fi
          for J in "$(which java)" "$HOME/tizen-studio/jdk/bin/java"; do
            r "T1 usando $J"
            "$J" -cp /tmp/cls Teste /tmp/autor.p12 2>&1 | sed 's/^/    /' | tee -a /tmp/resumo.txt
          done

      - name: Teste 2 - ler a chave com openssl
        continue-on-error: true
        env:
          SENHA: ${{ secrets.TIZEN_AUTHOR_PASS }}
        run: |
          . /tmp/h.sh
          if openssl pkcs12 -legacy -in /tmp/autor.p12 -nodes -passin env:SENHA 2>/tmp/ossl.log | grep -q 'PRIVATE KEY'; then
            r "T2 openssl le a chave privada: OK"
          else
            r "T2 openssl le a chave privada: FALHOU - $(tail -1 /tmp/ossl.log | cut -c1-120)"
          fi

      - name: Teste 3 - controles com certificado gerado pelo Tizen
        continue-on-error: true
        run: |
          . /tmp/h.sh
          gerar_e_testar() {
            ID="$1"; PW="$2"; ROT="$3"
            timeout 90 tizen certificate -a "C$ID" -p "$PW" -c BR -s MG -ct Cidade -o Teste -n Teste -e teste@example.com -f "c$ID" > "/tmp/cert-$ID.log" 2>&1
            P="$(find "$HOME/tizen-studio-data/keystore" -name "c$ID.p12" 2>/dev/null | head -1)"
            if [ -z "$P" ]; then r "T3 $ROT: nao gerou o certificado - $(tail -1 /tmp/cert-$ID.log | cut -c1-100)"; return; fi
            if ! timeout 90 tizen security-profiles add -n "p$ID" -a "$P" -p "$PW" > "/tmp/add-$ID.log" 2>&1; then
              r "T3 $ROT: FALHOU ao cadastrar - $(tail -1 /tmp/add-$ID.log | cut -c1-100)"; return
            fi
            mkdir -p "/tmp/s-$ID"
            if timeout 90 tizen package -t wgt -s "p$ID" -o "/tmp/s-$ID" -- /tmp/app > "/tmp/pkg-$ID.log" 2>&1; then
              r "T3 $ROT: OK"
            else
              r "T3 $ROT: FALHOU - $(grep -E 'Caused by|ERROR' "$HOME/tizen-studio-data/cli/logs/cli.log" | tail -1 | cut -c1-110)"
            fi
          }
          gerar_e_testar base "Abcd12345" "senha so com letras e numeros"
          i=0
          for S in '!' '@' '#' '$' '%' '^' '&' '*' '(' ')' '-' '_' '+' '=' '.' ',' ';' ':' '?' '~' '/'; do
            i=$((i+1))
            gerar_e_testar "s$i" "Abcd${S}1234" "senha com o simbolo $S"
          done

      - name: Teste 4 - seu certificado (o que falha no build)
        continue-on-error: true
        env:
          SENHA: ${{ secrets.TIZEN_AUTHOR_PASS }}
        run: |
          . /tmp/h.sh
          if tizen security-profiles add -n meu -a /tmp/autor.p12 -p "$SENHA" > /tmp/add-meu.log 2>&1; then
            r "T4 cadastrar o perfil: OK"
          else
            r "T4 cadastrar o perfil: FALHOU - $(tail -1 /tmp/add-meu.log | cut -c1-100)"
          fi
          mkdir -p /tmp/s-meu
          if tizen package -t wgt -s meu -o /tmp/s-meu -- /tmp/app > /tmp/pkg-meu.log 2>&1; then
            r "T4 empacotar com o seu certificado: OK"
          else
            r "T4 empacotar com o seu certificado: FALHOU. Motivo no log do Tizen:"
            grep -E 'Caused by|ERROR' "$HOME/tizen-studio-data/cli/logs/cli.log" | tail -3 | cut -c1-160 | tee -a /tmp/resumo.txt
          fi

      - name: Resumo
        if: always()
        run: |
          echo "=== RESUMO ==="
          cat /tmp/resumo.txt
          { echo '## Resumo do diagnóstico'; echo '```'; cat /tmp/resumo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
